[package]
name = "multiplexer-driver"
version = "0.2.1"
edition = "2024"
rust-version = "1.98"
description = "Drive tmux and Herdr workspaces, panes, and coding agents from one JSON CLI"
license = "MIT"
repository = "https://github.com/photuris/multiplexer-driver"
homepage = "https://github.com/photuris/multiplexer-driver"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
insta = "1"
rstest = "0.26"

[lints.rust]
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
expect_used = "deny"
missing_docs_in_private_items = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"
unwrap_used = "deny"

# Smallest binary: nothing here is hot, since every command waits on a
# harness subprocess. `panic = "abort"` is safe because nothing catches
# unwinds (tests build with unwinding regardless).
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
